name: Build Selected Service

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select the service to build"
        required: true
        type: choice
        options:
          - frontend
          - monolithic-backend
          - api-gateway
          - auth-service
          - cart-service
          - category-service
          - config-server
          - notification-service
          - order-service
          - product-service
          - service-registry
          - user-service

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FRONTEND BUILD (Node 16)
      - name: Set up Node.js
        if: ${{ github.event.inputs.service == 'frontend' }}
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Build Frontend
        if: ${{ github.event.inputs.service == 'frontend' }}
        working-directory: frontend
        run: |
          npm install
          npm run build

      # SETUP JAVA 17
      - name: Set up JDK 17
        if: ${{ github.event.inputs.service != 'frontend' }}
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # MONOLITHIC BACKEND BUILD
      - name: Build Monolithic Backend
        if: ${{ github.event.inputs.service == 'monolithic-backend' }}
        working-directory: monolithic-backend
        run: mvn clean install -DskipTests

      # MICROSERVICE BUILD
      - name: Build Microservice
        if: ${{ github.event.inputs.service != 'frontend' && github.event.inputs.service != 'monolithic-backend' }}
        working-directory: microservice-backend/${{ github.event.inputs.service }}
        run: mvn clean install -DskipTests

      # DOCKER LOGIN
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # DOCKER BUILD
      - name: Build Docker Image
        run: |
          if [ "${{ github.event.inputs.service }}" = "frontend" ]; then
            cd frontend
          elif [ "${{ github.event.inputs.service }}" = "monolithic-backend" ]; then
            cd monolithic-backend
          else
            cd microservice-backend/${{ github.event.inputs.service }}
          fi

          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }} .

      # DOCKER PUSH
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.service }}:${{ github.event.inputs.image_tag }}
